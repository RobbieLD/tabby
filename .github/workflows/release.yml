name: Release

'on':
  push:
    branches:
      - master
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.browser }} (${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            build: release
            extension: xpi
          - browser: firefox
            build: dev
            extension: xpi
          - browser: chromium
            build: release
            extension: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          TARGET_DIR: targets/${{ matrix.browser }}/${{ matrix.build }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the numeric X.Y.Z format."
            exit 1
          fi
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*.json' \
            -exec sed -i "s/__VERSION__/${RELEASE_VERSION}/g" {} +
          sed -i "s/__VERSION__/${RELEASE_VERSION}/g" src/components/Settings.svelte

      - name: Build
        run: yarn build

      - name: Type-check
        run: yarn typecheck

      - name: Package extension
        id: package_extension
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BROWSER: ${{ matrix.browser }}
          BUILD: ${{ matrix.build }}
          EXTENSION: ${{ matrix.extension }}
          FIREFOX_JWT_ISSUER: ${{ matrix.browser == 'firefox' && matrix.build == 'release' && secrets.FIREFOX_JWT_ISSUER || '' }}
          FIREFOX_JWT_SECRET: ${{ matrix.browser == 'firefox' && matrix.build == 'release' && secrets.FIREFOX_JWT_SECRET || '' }}
        run: |
          set -euo pipefail
          cp "targets/${BROWSER}/${BUILD}/manifest.json" public/manifest.json
          mkdir -p release-assets
          archive="tabby-${BROWSER}-${BUILD}.${EXTENSION}"
          (cd public && zip -q -r "$GITHUB_WORKSPACE/release-assets/$archive" .)
          update_manifest="targets/${BROWSER}/${BUILD}/update-${BROWSER}-${BUILD}.json"
          if [[ -f "$update_manifest" ]]; then
            cp "$update_manifest" release-assets/
          fi

          if [[ "$BROWSER" == "firefox" && "$BUILD" == "release" ]]; then
            if [[ -z "${FIREFOX_JWT_ISSUER:-}" || -z "${FIREFOX_JWT_SECRET:-}" ]]; then
              echo "::warning::AMO submission skipped. Add FIREFOX_JWT_ISSUER and FIREFOX_JWT_SECRET to repository Actions secrets."
              {
                echo "### Firefox AMO submission skipped"
                echo "Configure the repository Actions secrets \`FIREFOX_JWT_ISSUER\` and \`FIREFOX_JWT_SECRET\` to enable automatic submission."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "amo_configured=false" >> "$GITHUB_OUTPUT"
            else
              source_dir="$RUNNER_TEMP/tabby-source"
              mkdir -p "$source_dir/public" "$source_dir/targets/firefox"
              cp -R src package.json yarn.lock rollup.config.js tsconfig.json readme.md "$source_dir/"
              cp public/index.html "$source_dir/public/"
              cp -R public/images "$source_dir/public/"
              cp -R targets/firefox/release "$source_dir/targets/firefox/release"
              cp targets/firefox/release/manifest.json "$source_dir/public/manifest.json"
              (cd "$source_dir" && zip -q -r "$RUNNER_TEMP/tabby-source.zip" .)
              echo "amo_configured=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish Firefox add-on to AMO
        if: startsWith(github.ref, 'refs/tags/') && matrix.browser == 'firefox' && matrix.build == 'release' && steps.package_extension.outputs.amo_configured == 'true'
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1.2.1
        with:
          addon-guid: "{b95dddd7-a444-4cac-b348-ca6405b9409f}"
          xpi-path: release-assets/tabby-firefox-release.xpi
          source-file-path: ${{ runner.temp }}/tabby-source.zip
          self-hosted: "false"
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          license: MPL-2.0
          approval-notes: "Submitted automatically from GitHub release ${{ github.ref_name }}."

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.browser }}-${{ matrix.build }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
